name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd gpgv file xz-utils unzip python3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;23.2.13676358"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Patch pinned versions
        run: |
          sed -i 's|^PROOT_VERSION=.*|PROOT_VERSION="5.1.107.102"|' runtime/build-runtime.sh
          sed -i '/\[proot_5\.1\.107\.98_aarch64\.deb\]=/d' runtime/build-runtime.sh
          sed -i '/\[proot_5\.1\.107\.98_x86_64\.deb\]=/d' runtime/build-runtime.sh
          sed -i 's|^UBUNTU_ARCHIVE_AMD64=.*|UBUNTU_ARCHIVE_AMD64="http://archive.ubuntu.com/ubuntu"|' runtime/build-runtime.sh
          sed -i 's|^UBUNTU_ARCHIVE_ARM64=.*|UBUNTU_ARCHIVE_ARM64="http://ports.ubuntu.com/ubuntu-ports"|' runtime/build-runtime.sh
      - name: Build runtime
        env:
          DSH_BETA_TOKEN_FILE: ""
          UPDATE_DEB_LOCK: "1"
        run: bash runtime/build-runtime.sh arm64-v8a
      - name: Build APK
        env:
          DSH_BETA_TOKEN_FILE: ""
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/23.2.13676358
        run: bash tooling/build-apk.sh -f arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
