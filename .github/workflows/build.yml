name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y zstd gpgv file xz-utils unzip python3
      - name: Build runtime
        env:
          DSH_BETA_TOKEN_FILE: ""
        run: bash runtime/build-runtime.sh arm64-v8a
      - name: Build APK
        env:
          DSH_BETA_TOKEN_FILE: ""
        run: bash tooling/build-apk.sh -f arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
